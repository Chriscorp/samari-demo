<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<title>Samari Club — Agent</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap');

:root{
  --bg:#08090c; --bg2:#0d0f14;
  --card:#15181f; --card2:#1c202a; --line:#272c38;
  --gold:#f0b429; --gold2:#ffd464; --amber:#d97706;
  --txt:#f4f6fa; --mut:#8a93a6;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  /* tokens Stitch */
  --r-sm:12px; --r-md:18px; --r-lg:26px; --r-xl:32px;
  --sh-1:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
  --sh-gold:0 10px 34px -14px rgba(240,180,41,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;
  background:
    radial-gradient(1100px 520px at 50% -12%, rgba(240,180,41,.10), transparent 62%),
    radial-gradient(760px 420px at 100% 8%, rgba(217,119,6,.07), transparent 60%),
    var(--bg);
  color:var(--txt);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body{min-height:100vh;display:flex;flex-direction:column}

/* BARRE HAUTE */
.hdr{padding:14px 16px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid rgba(39,44,56,.7);
  background:rgba(8,9,12,.82);
  backdrop-filter:blur(20px) saturate(140%);position:sticky;top:0;z-index:20}
.logo{width:38px;height:38px;border-radius:var(--r-sm);flex:0 0 auto;
  background:linear-gradient(150deg,var(--gold2),var(--amber));
  box-shadow:var(--sh-gold);
  display:flex;align-items:center;justify-content:center;font-size:17px}
.hdr .t{flex:1;min-width:0}
.hdr .t b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.hdr .t span{font-size:10.5px;color:var(--mut);font-weight:500}
.clubsw{background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:var(--r-sm);padding:8px 11px;font-size:11.5px;font-weight:700;
  font-family:inherit;outline:none;max-width:118px;
  box-shadow:var(--sh-1)}

/* ZONE CHAT */
.chat{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:89%;padding:13px 16px;border-radius:var(--r-lg);font-size:14px;line-height:1.55;
  animation:pop .26s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;
  background:linear-gradient(150deg,var(--gold2),var(--gold));color:#0a0b0e;font-weight:650;
  border-bottom-right-radius:7px;box-shadow:var(--sh-gold)}
.msg.ag{align-self:flex-start;
  background:linear-gradient(160deg,#181c25,#13161d);
  border:1px solid var(--line);border-bottom-left-radius:7px;
  box-shadow:var(--sh-1)}
.msg.ag .act{display:block;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ok);font-weight:750;letter-spacing:.01em}
.msg.ag ul{margin:8px 0 0;padding-left:18px}
.msg.ag li{margin:4px 0;font-size:13px;color:#d7dce6}
.msg.ag b{color:var(--gold2);font-weight:750}

/* CARTES DONNÉES */
.data{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.drow{background:linear-gradient(160deg,#1e222c,#191d25);
  border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  transition:.18s}
.drow:active{transform:scale(.988)}
.drow .n{font-size:13px;font-weight:750;letter-spacing:-.015em}
.drow .s{font-size:10.5px;color:var(--mut);margin-top:2px;font-weight:500}
.tg{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.055em;
  padding:4px 9px;border-radius:999px;white-space:nowrap}
.tg.ok{background:rgba(52,211,153,.15);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(52,211,153,.22)}
.tg.warn{background:rgba(251,191,36,.15);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(251,191,36,.22)}
.tg.bad{background:rgba(248,113,113,.15);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(248,113,113,.22)}

/* SUGGESTIONS */
.sugg{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:0 0 auto;background:rgba(28,32,42,.9);border:1px solid var(--line);
  color:#a9b2c4;border-radius:999px;padding:9px 15px;font-size:12px;font-weight:600;
  font-family:inherit;cursor:pointer;white-space:nowrap;transition:.16s;
  box-shadow:var(--sh-1)}
.sugg button:active{background:var(--card2);color:var(--txt);transform:scale(.97)}

/* SAISIE */
.inputbar{padding:10px 16px 18px;background:linear-gradient(180deg,rgba(8,9,12,.55),rgba(8,9,12,.98) 40%);
  border-top:1px solid rgba(39,44,56,.6);position:sticky;bottom:0;
  backdrop-filter:blur(18px)}
.ibox{display:flex;gap:10px;align-items:flex-end}
.ibox textarea{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:var(--r-lg);padding:13px 17px;font-size:14.5px;font-family:inherit;
  resize:none;outline:none;max-height:110px;line-height:1.45;transition:.18s;
  box-shadow:var(--sh-1)}
.ibox textarea::placeholder{color:#5c6478}
.ibox textarea:focus{border-color:rgba(240,180,41,.45);box-shadow:0 0 0 3px rgba(240,180,41,.09)}
.send{width:46px;height:46px;border-radius:50%;border:0;
  background:linear-gradient(150deg,var(--gold2),var(--gold));
  color:#0a0b0e;font-size:20px;font-weight:800;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-gold);transition:.15s}
.send:active{transform:scale(.93)}

/* MODULES */
.tools{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;overflow-y:auto;padding:18px;
  background:
    radial-gradient(900px 420px at 50% -8%, rgba(240,180,41,.10), transparent 60%),
    var(--bg)}
.tools.on{display:flex;animation:pop .22s ease}
.tools .th{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.tools h3{margin:0;font-size:19px;font-weight:850;letter-spacing:-.025em}
.tools .cl{border:1px solid var(--line);background:var(--card);color:var(--txt);
  border-radius:var(--r-sm);padding:8px 13px;font-size:12px;font-weight:700;
  font-family:inherit;cursor:pointer;box-shadow:var(--sh-1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid button{background:linear-gradient(160deg,#191d25,#14171e);
  border:1px solid var(--line);border-radius:var(--r-md);
  color:var(--txt);padding:17px 12px;font-size:12.5px;font-weight:700;
  font-family:inherit;cursor:pointer;text-align:left;transition:.16s;
  box-shadow:var(--sh-1);letter-spacing:-.015em}
.grid button:active{background:var(--card2);transform:scale(.975);border-color:rgba(240,180,41,.3)}
.grid button .e{display:block;font-size:19px;margin-bottom:7px}

.fab{position:fixed;right:16px;bottom:100px;width:46px;height:46px;border-radius:50%;
  background:linear-gradient(150deg,#232834,#1a1e27);
  border:1px solid var(--line);color:var(--txt);
  font-size:18px;cursor:pointer;z-index:30;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-1);transition:.15s}
.fab:active{transform:scale(.94)}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">🏍️</div>
  <div class="t">
    <b id="clubName">Samari Club</b>
    <span id="clubSub">Porto-Novo · 1 salle</span>
  </div>
  <select class="clubsw" id="usersw" onchange="switchUser(this.value)"></select>
  <select class="clubsw" id="clubsw" onchange="switchClub(this.value)"></select>
</div>

<div class="chat" id="chat"></div>

<div class="sugg" id="sugg"></div>

<div class="inputbar">
  <div class="ibox">
    <textarea id="inp" rows="1"
      placeholder="Dites-moi ce qu'il faut faire…"></textarea>
    <button class="send" onclick="send()">↑</button>
  </div>
</div>

<button class="fab" onclick="openTools()">☰</button>

<div class="tools" id="tools">
  <div class="th"><h3>Modules</h3><button class="cl" onclick="closeTools()">Fermer</button></div>
  <div class="grid" id="grid"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   MODÈLE CLOISONNÉ
   Chaque enregistrement porte club_id. Aucun accès sans ce champ.
   C'est la règle posée dès le premier jour — pas ajoutée après.
   ═══════════════════════════════════════════════════════════════ */

const KEY = "samari_agent_v3";
const CLUBS = [
  { id: "samari-porto", nom: "Samari Club", ville: "Porto-Novo" },
  { id: "samari-cotonou", nom: "Samari Cotonou", ville: "Cotonou" }
];

/* ═══════════════════════════════════════════════════════════════
   RÔLES ET UTILISATEURS
   Le cloisonnement est PAR DÉFAUT : un rôle inconnu ne voit rien.
   ═══════════════════════════════════════════════════════════════ */

const ROLES = {
  admin:    { libelle:"Admin",    desc:"Voit tout, décide de tout",           e:"👑" },
  associe:  { libelle:"Associé",  desc:"Voit tout, aucune décision financière", e:"🤝" },
  coach:    { libelle:"Coach",    desc:"Ses adhérents, exercices, machines",    e:"🏋️" },
  adherent: { libelle:"Adhérent",  desc:"Uniquement ses propres données",      e:"🙋" }
};

const USERS = [
  { id:"u1", nom:"Abou",          role:"admin",    club_id:"samari-porto" },
  { id:"u2", nom:"Chris",         role:"associe",  club_id:"samari-porto" },
  { id:"u3", nom:"Serge",         role:"coach",    club_id:"samari-porto", coach:"Serge" },
  { id:"u4", nom:"Dossou Marie",  role:"adherent", club_id:"samari-porto", membre:"Dossou Marie" }
];

/* Matrice d'accès aux modules — par rôle. Rien n'est ouvert par défaut.
   LECTURE : admin et associé voient tout ; coach et adhérent sont restreints.
   DÉCISION : voir DROIT ci-dessous — l'associé lit les finances mais ne les engage pas. */
const ACCES = {
  tdb:           ["admin","associe"],
  adherents:     ["admin","associe","coach"],
  finances:      ["admin","associe"],
  presences:     ["admin","associe","coach"],
  echeances:     ["admin","associe"],
  planning:      ["admin","associe","coach","adherent"],
  avis:          ["admin","associe"],
  personnel:     ["admin","associe"],
  rapports:      ["admin","associe"],
  annonces:      ["admin","associe","coach","adherent"],
  bons:          ["admin","associe","coach"],
  textes:        ["admin","associe","coach"],
  equipements:   ["admin","associe","coach"],
  exercices:     ["admin","associe","coach","adherent"],
  administratif: ["admin","associe"]
};

function me() { return USERS.find(u => u.id === DB.user) || USERS[0]; }
function role() { return me().role; }
function peut(module) {
  const ok = ACCES[module];
  if (!ok) return false;                 /* module inconnu → refusé */
  return ok.includes(role());            /* rôle inconnu → refusé */
}
function refus(action) {
  return { ok:false, msg:`Action refusée. Votre rôle **${ROLES[role()].libelle}** ne permet pas ${action}.` };
}

/* ═══ QUI PEUT FAIRE QUOI ═══
   Le rôle n'est pas décoratif : il conditionne l'ACTION, pas seulement l'affichage.
   Associer ne peut lire les finances, mais ne peut rien encaisser ni dépenser. */
const DROIT = {
  ajouterMembre:  ["admin","associe"],
  payer:          ["admin"],              /* décision financière → admin seul */
  pointer:        ["admin","coach"],
  ajouterCours:   ["admin","coach"],
  ajouterAvis:    ["admin","associe"],
  ajouterAnnonce: ["admin","associe"],
  ajouterBon:     ["admin"],
  ajouterExercice:["admin","coach"],
  supprimer:      ["admin"]
};
function autorise(action) {
  const l = DROIT[action];
  if (!l) return true;                    /* lecture : filtre appliqué par scope() */
  return l.includes(role());
}

function seed() {
  const now = Date.now(), d = n => now + n * 86400000;
  return {
    club: "samari-porto",
    user: "u1",
    membres: [
      { id:1, club_id:"samari-porto", nom:"Ayaba Christelle", tel:"+229 97 12 34 56", form:"Mensuel", fin:d(18), coach:"Serge" },
      { id:2, club_id:"samari-porto", nom:"Dossou Marie", tel:"+229 96 45 78 12", form:"Mensuel", fin:d(4), coach:"Serge" },
      { id:3, club_id:"samari-porto", nom:"Kpadonou Serge", tel:"+229 95 33 21 90", form:"Trimestriel", fin:d(62), coach:"Abou" },
      { id:4, club_id:"samari-porto", nom:"Houngbédji Ange", tel:"+229 97 88 44 20", form:"Annuel", fin:d(210), coach:"Serge" },
      { id:5, club_id:"samari-porto", nom:"Bocco Rachidatou", tel:"+229 96 21 55 33", form:"Mensuel", fin:d(2), coach:"Abou" },
      { id:6, club_id:"samari-porto", nom:"Agossou Bienvenu", tel:"+229 94 77 11 02", form:"Mensuel", fin:d(11), coach:"Serge" },
      { id:7, club_id:"samari-porto", nom:"Tossou Léonie", tel:"+229 97 60 40 08", form:"Trimestriel", fin:d(48), coach:"Abou" },
      { id:8, club_id:"samari-porto", nom:"Zinsou Modeste", tel:"+229 95 12 88 76", form:"Mensuel", fin:d(23), coach:"Serge" },
      { id:9, club_id:"samari-porto", nom:"Ahouandjinou Rose", tel:"+229 96 99 30 45", form:"Mensuel", fin:d(6), coach:"Abou" },
      /* club 2 — pour prouver le cloisonnement */
      { id:20, club_id:"samari-cotonou", nom:"Adjovi Paul", tel:"+229 97 00 11 22", form:"Mensuel", fin:d(12) },
      { id:21, club_id:"samari-cotonou", nom:"Sossou Gisèle", tel:"+229 96 33 44 55", form:"Trimestriel", fin:d(75) }
    ],
    ops: [
      { id:1, club_id:"samari-porto", type:"recette", lib:"Abonnement Dossou Marie", montant:5000, jour:0 },
      { id:2, club_id:"samari-porto", type:"recette", lib:"Abonnement Ayaba Christelle", montant:5000, jour:1 },
      { id:3, club_id:"samari-porto", type:"depense", lib:"Électricité", montant:18000, jour:2 },
      { id:4, club_id:"samari-porto", type:"recette", lib:"Abonnement Kpadonou Serge", montant:13500, jour:3 },
      { id:5, club_id:"samari-porto", type:"depense", lib:"Entretien matériel", montant:9000, jour:4 },
      { id:20, club_id:"samari-cotonou", type:"recette", lib:"Abonnement Adjovi Paul", montant:5000, jour:1 }
    ],
    pres: [
      { id:1, club_id:"samari-porto", membre:"Ayaba Christelle", jour:0 },
      { id:2, club_id:"samari-porto", membre:"Zinsou Modeste", jour:0 },
      { id:3, club_id:"samari-porto", membre:"Tossou Léonie", jour:1 },
      { id:20, club_id:"samari-cotonou", membre:"Adjovi Paul", jour:0 }
    ],
    cours: [
      { id:1, club_id:"samari-porto", jour:"Lundi", txt:"18h — Cardio", coach:"Abou" },
      { id:2, club_id:"samari-porto", jour:"Mardi", txt:"19h — Musculation", coach:"Serge" },
      { id:3, club_id:"samari-porto", jour:"Mercredi", txt:"18h — Cardio", coach:"Abou" },
      { id:4, club_id:"samari-porto", jour:"Jeudi", txt:"19h — Cross-training", coach:"Serge" },
      { id:5, club_id:"samari-porto", jour:"Vendredi", txt:"18h — Musculation", coach:"Abou" },
      { id:6, club_id:"samari-porto", jour:"Samedi", txt:"10h — Cardio", coach:"Serge" },
      { id:20, club_id:"samari-cotonou", jour:"Lundi", txt:"18h — Fitness", coach:"Paul" }
    ],
    avis: [
      { id:1, club_id:"samari-porto", membre:"Kpadonou Serge", note:5, txt:"Ambiance au top" },
      { id:2, club_id:"samari-porto", membre:"Tossou Léonie", note:4, txt:"Bon matériel" }
    ],
    personnel: [
      { id:1, club_id:"samari-porto", nom:"Abou", role:"Administrateur" },
      { id:2, club_id:"samari-porto", nom:"Chris", role:"Associé" },
      { id:3, club_id:"samari-porto", nom:"Serge", role:"Coach" },
      { id:20, club_id:"samari-cotonou", nom:"Paul", role:"Gérant" }
    ],
    annonces: [
      { id:1, club_id:"samari-porto", texte:"Fermeture exceptionnelle le 15 novembre", jour:2 }
    ],
    bons: [
      { id:1, club_id:"samari-porto", membre:"Dossou Marie", type:"Séance offerte", utilise:false },
      { id:2, club_id:"samari-porto", membre:"Agossou Bienvenu", type:"10 % réduction", utilise:true }
    ],
    textes: [
      { id:1, club_id:"samari-porto", nom:"Relance échéance", txt:"Bonjour {nom}, votre abonnement expire le {date}. Passez nous voir !" },
      { id:2, club_id:"samari-porto", nom:"Bienvenue", txt:"Bienvenue {nom} au Samari Club !" }
    ],
    equipements: [
      { id:1, club_id:"samari-porto", nom:"Tapis de course", etat:"Bon", coach:"Serge" },
      { id:2, club_id:"samari-porto", nom:"Rameur", etat:"À réviser", coach:"Serge" },
      { id:3, club_id:"samari-porto", nom:"Haltères 2–20 kg", etat:"Bon", coach:"Abou" }
    ],
    exercices: [
      { id:1, club_id:"samari-porto", membre:"Dossou Marie", coach:"Serge", nom:"Squat", series:"4×12", note:"genoux fragiles" },
      { id:2, club_id:"samari-porto", membre:"Dossou Marie", coach:"Serge", nom:"Développé couché", series:"3×10", note:"" },
      { id:3, club_id:"samari-porto", membre:"Ayaba Christelle", coach:"Serge", nom:"Rameur", series:"3×5 min", note:"cardio" },
      { id:4, club_id:"samari-porto", membre:"Kpadonou Serge", coach:"Abou", nom:"Soulevé de terre", series:"5×5", note:"" }
    ]
  };
}

let DB = JSON.parse(localStorage.getItem(KEY) || "null") || seed();
/* migration : si une sauvegarde ancienne n'a pas les nouveaux modules, on les ajoute */
(function migrate(){
  const base = seed();
  let touched = false;
  for (const k of ["membres","ops","pres","cours","avis","personnel","annonces","bons","textes","equipements"]) {
    if (!Array.isArray(DB[k])) { DB[k] = base[k]; touched = true; }
  }
  if (!DB.club) { DB.club = base.club; touched = true; }
  if (!DB.user) { DB.user = base.user; touched = true; }
  if (!Array.isArray(DB.exercices)) { DB.exercices = base.exercices; touched = true; }
  if (touched) localStorage.setItem(KEY, JSON.stringify(DB));
})();
const save = () => localStorage.setItem(KEY, JSON.stringify(DB));

/* ═══ CLOISONNEMENT — point d'entrée unique ═══
   Deux niveaux : le club (club_id), puis le rôle.
   Un adhérent ne voit que SA ligne. Un coach ne voit que SES adhérents. */
function scope() {
  const c = DB.club;
  const r = role();
  const u = me();
  const g = k => Array.isArray(DB[k]) ? DB[k].filter(x => x.club_id === c) : [];

  const mine = list => {
    if (r === "adherent") return list.filter(x => norm(x.nom || x.membre) === norm(u.membre));
    if (r === "coach")     return list.filter(x => !x.coach || norm(x.coach) === norm(u.coach));
    return list;
  };

  const membres = g("membres");
  /* un adhérent ne voit que sa fiche ; un coach ne voit que SES adhérents */
  const membresVisibles =
      r === "adherent" ? membres.filter(m => norm(m.nom) === norm(u.membre))
    : r === "coach"    ? membres.filter(m => norm(m.coach) === norm(u.coach))
    : membres;

  return {
    club: c,
    role: r,
    user: u,
    membres: membresVisibles,
    ops:     peut("finances") ? g("ops") : [],
    pres:    r === "adherent"
               ? g("pres").filter(p => norm(p.membre) === norm(u.membre))
               : r === "coach"
                 ? g("pres").filter(p => membresVisibles.some(m => norm(m.nom) === norm(p.membre)))
                 : g("pres"),
    cours:   g("cours"),
    avis:    r === "adherent"
               ? g("avis").filter(a => norm(a.membre) === norm(u.membre))
               : g("avis"),
    personnel: peut("personnel") ? g("personnel") : [],
    annonces: g("annonces"),
    bons:    r === "adherent"
               ? g("bons").filter(b => norm(b.membre) === norm(u.membre))
               : g("bons"),
    textes:  peut("textes") ? g("textes") : [],
    equipements: peut("equipements") ? g("equipements") : [],
    exercices: r === "adherent"
               ? g("exercices").filter(e => norm(e.membre) === norm(u.membre))
               : r === "coach"
                 ? g("exercices").filter(e => !e.coach || norm(e.coach) === norm(u.coach))
                 : g("exercices")
  };
}

/* ═══ OUTILS DE L'AGENT — il AGIT, il ne répond pas seulement ═══ */
const tool = {
  ajouterMembre({ nom, tel, formule }) {
    if (!autorise("ajouterMembre")) return refus("créer un adhérent");
    const s = scope();
    if (s.membres.some(m => norm(m.nom) === norm(nom)))
      return { ok:false, msg:`${nom} existe déjà dans ce club.` };
    DB.membres.push({
      id: Date.now(), club_id: DB.club, nom,
      tel: tel || "—", form: formule || "Mensuel",
      fin: Date.now() + 30 * 86400000
    });
    save();
    return { ok:true, msg:`**${nom}** ajouté à ${clubOf(DB.club).nom}. Abonnement mensuel jusqu'au ${fmtDate(Date.now()+30*86400000)}.` };
  },

  payer({ nom, montant }) {
    if (!autorise("payer")) return refus("encaisser un paiement (décision financière)");
    const s = scope();
    const m = find(s.membres, nom);
    if (!m) return { ok:false, msg:`Je ne trouve pas **${nom}** dans ${clubOf(DB.club).nom}.` };
    const duree = m.form === "Annuel" ? 365 : m.form === "Trimestriel" ? 90 : 30;
    const base = Math.max(m.fin, Date.now());
    m.fin = base + duree * 86400000;
    DB.ops.push({ id:Date.now(), club_id:DB.club, type:"recette",
      lib:`Abonnement ${m.nom}`, montant: montant || 5000, jour:0 });
    DB.pres.push({ id:Date.now()+1, club_id:DB.club, membre:m.nom, jour:0 });
    save();
    return { ok:true, msg:`Paiement enregistré pour **${m.nom}** : ${(montant||5000).toLocaleString("fr-FR")} FCFA.
      Abonnement prolongé de ${duree} jours → **${fmtDate(m.fin)}**. Présence notée aujourd'hui.` };
  },

  pointer({ nom }) {
    if (!autorise("pointer")) return refus("pointer une présence");
    const s = scope();
    const m = find(s.membres, nom);
    if (!m) return { ok:false, msg:`Je ne trouve pas **${nom}** dans ce club.` };
    if (jours(m.fin) < 0) return { ok:false, msg:`**${m.nom}** a un abonnement expiré depuis ${Math.abs(jours(m.fin))} jours. Faut-il encaisser avant de pointer ?` };
    DB.pres.push({ id:Date.now(), club_id:DB.club, membre:m.nom, jour:0 });
    save();
    return { ok:true, msg:`Présence notée pour **${m.nom}**.` };
  },

  echeances({ joursMax }) {
    const s = scope();
    const j = joursMax || 7;
    const l = s.membres.filter(m => jours(m.fin) <= j).sort((a,b) => a.fin - b.fin);
    if (!l.length) return { ok:true, msg:`Aucun adhérent n'expire dans les ${j} jours.`, list:[] };
    return {
      ok:true,
      msg:`**${l.length} adhérent(s)** expirent dans les ${j} jours :`,
      list: l.map(m => ({
        n: m.nom,
        s: `${m.form} · ${m.tel}`,
        tag: jours(m.fin) < 0 ? "Expiré" : jours(m.fin) + " j",
        cls: jours(m.fin) < 0 ? "bad" : jours(m.fin) <= 3 ? "bad" : "warn"
      }))
    };
  },

  stats() {
    const s = scope();
    const actifs = s.membres.filter(m => jours(m.fin) >= 0);
    const R = s.ops.filter(o => o.type === "recette").reduce((a,o) => a+o.montant, 0);
    const D = s.ops.filter(o => o.type === "depense").reduce((a,o) => a+o.montant, 0);
    return {
      ok:true,
      msg:`**${clubOf(DB.club).nom}** — ${actifs.length} adhérents actifs sur ${s.membres.length}.`,
      list: [
        { n:"Adhérents actifs", s:`sur ${s.membres.length} inscrits`, tag:String(actifs.length), cls:"ok" },
        { n:"Expirent sous 7 jours", s:"à relancer", tag:String(actifs.filter(m=>jours(m.fin)<=7).length), cls:"warn" },
        { n:"Recettes cumulées", s:"depuis le début", tag:R.toLocaleString("fr-FR")+" F", cls:"ok" },
        { n:"Dépenses cumulées", s:"depuis le début", tag:D.toLocaleString("fr-FR")+" F", cls:"bad" },
        { n:"Solde", s:"recettes − dépenses", tag:(R-D).toLocaleString("fr-FR")+" F", cls:"ok" }
      ]
    };
  },

  presences() {
    const s = scope();
    const t = s.pres.filter(p => p.jour === 0);
    return {
      ok:true,
      msg:`**${t.length} présence(s)** aujourd'hui à ${clubOf(DB.club).nom}.`,
      list: t.map(p => ({ n:p.membre, s:"pointé aujourd'hui", tag:"Présent", cls:"ok" }))
    };
  },

  lister() {
    const s = scope();
    return {
      ok:true,
      msg:`**${s.membres.length} adhérent(s)** à ${clubOf(DB.club).nom} :`,
      list: s.membres.map(m => ({
        n:m.nom, s:`${m.form} · ${m.tel}`,
        tag: jours(m.fin) < 0 ? "Expiré" : jours(m.fin)+" j",
        cls: jours(m.fin) < 0 ? "bad" : jours(m.fin) <= 7 ? "warn" : "ok"
      }))
    };
  },

  /* ═══ PLANNING ═══ */
  planning({ jour }) {
    const s = scope();
    const jours7 = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
    const l = jour
      ? s.cours.filter(c => norm(c.jour) === norm(jour))
      : s.cours;
    if (!l.length && jour) return { ok:true, msg:`Aucun cours le ${jour}.` };
    if (!l.length) return { ok:true, msg:`Aucun cours au planning.` };
    const ordre = c => jours7.indexOf(c.jour);
    const tri = l.slice().sort((a,b) => ordre(a) - ordre(b));
    return {
      ok:true,
      msg: jour ? `**${jour}** à ${clubOf(DB.club).nom} :`
                : `**${s.cours.length} cours** au planning de ${clubOf(DB.club).nom} :`,
      list: tri.map(c => ({ n:c.txt, s:c.jour + (c.coach ? " · "+c.coach : ""), tag:"Cours", cls:"ok" }))
    };
  },

  ajouterCours({ jour, txt, coach }) {
    if (!autorise("ajouterCours")) return refus("ajouter un cours");
    const jours7 = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
    const j = jours7.find(x => norm(x) === norm(jour));
    if (!j) return { ok:false, msg:`Quel jour ? (${jours7.slice(0,6).join(", ")})` };
    DB.cours.push({ id:Date.now(), club_id:DB.club, jour:j, txt, coach: coach||"" });
    save();
    return { ok:true, msg:`Cours ajouté : **${txt}** le **${j}**${coach?" avec "+coach:""}.` };
  },

  /* ═══ AVIS ═══ */
  avis() {
    const s = scope();
    if (!s.avis.length) return { ok:true, msg:`Aucun avis enregistré à ${clubOf(DB.club).nom}.` };
    const moy = (s.avis.reduce((a,x) => a+x.note, 0) / s.avis.length).toFixed(1);
    return {
      ok:true,
      msg:`**${s.avis.length} avis** — moyenne **${moy}/5** :`,
      list: s.avis.map(a => ({
        n:a.membre, s:a.txt, tag:a.note+"/5",
        cls: a.note >= 4 ? "ok" : a.note >= 3 ? "warn" : "bad"
      }))
    };
  },

  ajouterAvis({ nom, note, txt }) {
    if (!autorise("ajouterAvis")) return refus("enregistrer un avis");
    const s = scope();
    const m = find(s.membres, nom);
    const n = Math.max(1, Math.min(5, parseInt(note,10) || 5));
    DB.avis.push({ id:Date.now(), club_id:DB.club, membre: m ? m.nom : nom, note:n, txt: txt||"" });
    save();
    return { ok:true, msg:`Avis enregistré pour **${m?m.nom:nom}** : ${n}/5${txt?" — « "+txt+" »":""}.` };
  },

  /* ═══ PERSONNEL ═══ */
  personnel() {
    const s = scope();
    return {
      ok:true,
      msg:`**${s.personnel.length} personne(s)** à ${clubOf(DB.club).nom} :`,
      list: s.personnel.map(p => ({ n:p.nom, s:p.role, tag:"Actif", cls:"ok" }))
    };
  },

  /* ═══ ANNONCES ═══ */
  annonces() {
    const s = scope();
    if (!s.annonces.length) return { ok:true, msg:`Aucune annonce publiée à ${clubOf(DB.club).nom}.` };
    return {
      ok:true,
      msg:`**${s.annonces.length} annonce(s)** à ${clubOf(DB.club).nom} :`,
      list: s.annonces.map(a => ({ n:a.texte, s:"publiée il y a "+a.jour+" j", tag:"En ligne", cls:"ok" }))
    };
  },

  ajouterAnnonce({ texte }) {
    if (!autorise("ajouterAnnonce")) return refus("publier une annonce");
    if (!texte || texte.length < 3) return { ok:false, msg:"Que faut-il annoncer ?" };
    DB.annonces.push({ id:Date.now(), club_id:DB.club, texte, jour:0 });
    save();
    return { ok:true, msg:`Annonce publiée : « ${texte} »` };
  },

  /* ═══ BONS ═══ */
  bons() {
    const s = scope();
    if (!s.bons.length) return { ok:true, msg:`Aucun bon en circulation à ${clubOf(DB.club).nom}.` };
    const actifs = s.bons.filter(b => !b.utilise);
    return {
      ok:true,
      msg:`**${actifs.length} bon(s) actif(s)** sur ${s.bons.length} :`,
      list: s.bons.map(b => ({
        n:b.membre, s:b.type, tag: b.utilise ? "Utilisé" : "Actif",
        cls: b.utilise ? "bad" : "ok"
      }))
    };
  },

  ajouterBon({ nom, type }) {
    if (!autorise("ajouterBon")) return refus("créer un bon");
    const s = scope();
    const m = find(s.membres, nom);
    if (!m) return { ok:false, msg:`Je ne trouve pas **${nom}** dans ce club.` };
    DB.bons.push({ id:Date.now(), club_id:DB.club, membre:m.nom, type: type||"Séance offerte", utilise:false });
    save();
    return { ok:true, msg:`Bon créé pour **${m.nom}** : ${type||"Séance offerte"}.` };
  },

  /* ═══ TEXTES ═══ */
  textes() {
    const s = scope();
    if (!s.textes.length) return { ok:true, msg:`Aucun modèle de message à ${clubOf(DB.club).nom}.` };
    return {
      ok:true,
      msg:`**${s.textes.length} modèle(s)** de message :`,
      list: s.textes.map(t => ({ n:t.nom, s:t.txt.slice(0,56)+"…", tag:"Modèle", cls:"ok" }))
    };
  },

  /* ═══ ÉQUIPEMENTS ═══ */
  equipements() {
    const s = scope();
    if (!s.equipements.length) return { ok:true, msg:`Aucun équipement enregistré.` };
    const aRevoir = s.equipements.filter(e => norm(e.etat) !== "bon").length;
    return {
      ok:true,
      msg:`**${s.equipements.length} équipement(s)** — ${aRevoir} à réviser :`,
      list: s.equipements.map(e => ({
        n:e.nom, s:"état : "+e.etat, tag:e.etat,
        cls: norm(e.etat) === "bon" ? "ok" : "warn"
      }))
    };
  },

  /* ═══ ADMINISTRATIF ═══ */
  administratif() {
    const s = scope(), c = clubOf(DB.club);
    return {
      ok:true,
      msg:`**${c.nom}** — fiche du club :`,
      list: [
        { n:"Club", s:c.ville+" · Bénin", tag:"Actif", cls:"ok" },
        { n:"Adhérents", s:"dans ce club uniquement", tag:String(s.membres.length), cls:"ok" },
        { n:"Personnel", s:"comptes rattachés", tag:String(s.personnel.length), cls:"ok" },
        { n:"Cloisonnement", s:"club_id = "+c.id, tag:"Isolé", cls:"ok" },
        { n:"Autres clubs", s:"non accessibles depuis ici", tag:String(CLUBS.length-1), cls:"warn" }
      ]
    };
  },

  /* ═══ RAPPORTS ═══ */
  rapports() {
    const s = scope();
    const R = s.ops.filter(o => o.type === "recette").reduce((a,o) => a+o.montant, 0);
    const D = s.ops.filter(o => o.type === "depense").reduce((a,o) => a+o.montant, 0);
    const actifs = s.membres.filter(m => jours(m.fin) >= 0).length;
    const pres = s.pres.filter(p => p.jour === 0).length;
    return {
      ok:true,
      msg:`**Rapport** — ${clubOf(DB.club).nom} :`,
      list: [
        { n:"Adhérents actifs", s:"abonnements en cours", tag:String(actifs), cls:"ok" },
        { n:"Présences aujourd'hui", s:"pointages enregistrés", tag:String(pres), cls:"ok" },
        { n:"Recettes", s:"cumul depuis le début", tag:R.toLocaleString("fr-FR")+" F", cls:"ok" },
        { n:"Dépenses", s:"cumul depuis le début", tag:D.toLocaleString("fr-FR")+" F", cls:"bad" },
        { n:"Résultat", s:"recettes − dépenses", tag:(R-D).toLocaleString("fr-FR")+" F", cls:(R-D)>=0?"ok":"bad" },
        { n:"Taux de présence", s:"aujourd'hui / adhérents", tag: actifs ? Math.round(pres/actifs*100)+" %" : "—", cls:"warn" }
      ]
    };
  },

  /* ═══ EXERCICES ═══ */
  exercices() {
    const s = scope();
    if (!s.exercices.length) return { ok:true, msg:`Aucun exercice assigné à ${clubOf(DB.club).nom}.` };
    return {
      ok:true,
      msg:`**${s.exercices.length} exercice(s)** assigné(s) :`,
      list: s.exercices.map(e => ({
        n: `${e.nom} — ${e.series}`,
        s: `${e.membre} · coach ${e.coach}${e.note ? " · " + e.note : ""}`,
        tag: "Assigné", cls: "ok"
      }))
    };
  },

  mesExercices() {
    const s = scope();
    const u = me();
    const l = s.exercices.filter(e => norm(e.membre) === norm(u.membre));
    if (!l.length) return { ok:true, msg:`Aucun exercice ne vous est assigné pour le moment.` };
    return {
      ok:true,
      msg:`**Votre programme** — ${u.membre} :`,
      list: l.map(e => ({
        n: e.nom, s: `${e.series} · coach ${e.coach}${e.note ? " · " + e.note : ""}`,
        tag: "À faire", cls: "warn"
      }))
    };
  },

  ajouterExercice({ nom, membre, series, note }) {
    if (!autorise("ajouterExercice")) return refus("assigner un exercice");
    const s = scope();
    const m = find(s.membres, membre);
    if (!m) return { ok:false, msg:`Je ne trouve pas **${membre}** dans ce club.` };
    DB.exercices.push({
      id: Date.now(), club_id: DB.club, membre: m.nom,
      coach: me().coach || me().nom, nom, series: series || "3×10", note: note || ""
    });
    save();
    return { ok:true, msg:`Exercice **${nom}** assigné à **${m.nom}** (${series || "3×10"}).` };
  }
};

/* ═══ COMPRÉHENSION ═══ */
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const jours = f => Math.ceil((f - Date.now()) / 86400000);
const clubOf = id => CLUBS.find(c => c.id === id) || CLUBS[0];
const fmtDate = ts => new Date(ts).toLocaleDateString("fr-FR",{day:"2-digit",month:"long"});

function find(liste, nom) {
  const n = norm(nom);
  let m = liste.find(x => norm(x.nom) === n);
  if (m) return m;
  m = liste.find(x => norm(x.nom).includes(n));
  if (m) return m;
  const parts = n.split(/\s+/).filter(p => p.length > 2);
  return liste.find(x => parts.length && parts.every(p => norm(x.nom).includes(p)));
}

/* extrait un nom propre d'une phrase */
function extraireNom(q) {
  const s = scope();
  const nq = norm(q);
  /* 1. correspondance exacte avec un adhérent connu */
  for (const m of s.membres) {
    if (nq.includes(norm(m.nom))) return m.nom;
    const prenom = norm(m.nom).split(/\s+/)[0];
    if (prenom.length > 3 && nq.includes(prenom)) return m.nom;
  }
  /* 2. après "ajoute/ajouter/crée" — on prend les mots capitalisés */
  const m2 = q.match(/(?:ajoute[rz]?|cr[ée]e[rz]?|inscri[re]+|nouvel? adh[ée]rent)\s+(?:un\s+|une\s+|le\s+|la\s+)?([A-ZÀ-Ý][\wÀ-ÿ'’-]+(?:\s+[A-ZÀ-Ý][\wÀ-ÿ'’-]+){0,2})/);
  if (m2) return m2[1].trim();
  return null;
}

/* ═══ LE CERVEAU ═══ */
function penser(q) {
  const s = norm(q);

  /* ═══ PRIORITÉ 0 : le planning, avant tout le reste ═══
     « ajoute un cours de cardio mercredi 18h » ne doit jamais
     être pris pour la création d'un adhérent. */
  if (/planning|\bcours\b|s[ée]ance|entra[îi]nement|programme/.test(s)) {
    const j = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"]
      .find(x => s.includes(x));
    if (/ajout|cr[ée]|programme|nouveau cours|planifie/.test(s)) {
      if (!j) return { ok:false, msg:"Quel jour ? (Lundi, Mardi, Mercredi…)" };
      const jour = j.charAt(0).toUpperCase()+j.slice(1);
      const h = q.match(/(\d{1,2})\s*h\s*(\d{0,2})/);
      const nomC = q.match(/(cardio|musculation|cross[\s-]?training|fitness|yoga|boxe|zumba|abdo|mobilit[ée]|danse)/i);
      const txt = (h ? h[1]+"h"+(h[2]||"")+" — " : "") +
        (nomC ? nomC[1].charAt(0).toUpperCase()+nomC[1].slice(1).toLowerCase() : "Cours");
      return tool.ajouterCours({ jour, txt });
    }
    return tool.planning({ jour: j ? j.charAt(0).toUpperCase()+j.slice(1) : null });
  }

  /* --- ACTIONS PRIORITAIRES --- */

  /* paiement */
  if (/(pay|paye|payé|régl|regl|encaiss|versé|verse|cotisation).*(mois|an|trim|abonnement)|^(pay|paye)/.test(s)
      || /(a|à) pay/.test(s)) {
    const nom = extraireNom(q);
    if (!nom) return { ok:false, msg:"Qui a payé ? Donnez-moi le nom." };
    const mnt = q.match(/(\d[\d\s]{2,})/);
    return tool.payer({ nom, montant: mnt ? parseInt(mnt[1].replace(/\s/g,""),10) : null });
  }

  /* ajout d'adhérent — resserré : doit mentionner adhérent/membre/client */
  if (/(ajout|cr[ée]|inscri|nouvel|enregistr)[a-z]*\s*(?:un |une |le |la )?(?:nouvel |nouvelle )?(?:adh[ée]rent|membre|client)/.test(s)
      || /^(ajoute|ajouter|cree|créer)\s+[A-ZÀ-Ý]/.test(q)) {
    const nom = extraireNom(q);
    if (!nom || nom.split(/\s+/).length < 1) return { ok:false, msg:"Quel nom dois-je enregistrer ?" };
    const tel = q.match(/(\+?\d[\d\s]{7,})/);
    const formule = /annuel/.test(s) ? "Annuel" : /trimestr/.test(s) ? "Trimestriel" : "Mensuel";
    return tool.ajouterMembre({ nom, tel: tel ? tel[1].trim() : null, formule });
  }

  /* présence */
  if (/(est l[àa]|pr[ée]sent|pointer|pointage|arriv|vient d'arriver|scann)/.test(s)) {
    const nom = extraireNom(q);
    if (!nom) return tool.presences();
    return tool.pointer({ nom });
  }

  /* échéances */
  if (/(expire|expir|échéance|echeance|renouvel|relanc|fin d'abonnement|qui doit payer)/.test(s)) {
    const j = /mois/.test(s) ? 31 : /3 jour|trois jour/.test(s) ? 3 : /aujourd/.test(s) ? 0 : 7;
    return tool.echeances({ joursMax: j });
  }

  /* chiffres */
  if (/(combien|total|chiffre|recette|d[ée]pense|solde|b[ée]n[ée]fice|gagn|encaiss)/.test(s)) {
    if (/adh[ée]rent|membre/.test(s) && !/recette|d[ée]pense/.test(s)) return tool.lister();
    if (/pr[ée]sent/.test(s)) return tool.presences();
    return tool.stats();
  }

  /* liste des adhérents — resserré pour ne pas capter les autres modules */
  if (/(liste|montre|affiche|tous les|voir les|combien de).*(adh[ée]rent|membre|client)|^adh[ée]rents?$|^(les )?adh[ée]rents$/.test(s)) return tool.lister();

  /* ═══ MODULES SPÉCIALISÉS ═══ */

  if (/planning|cours|s[ée]ance|entra[îi]nement|programme/.test(s)) {
    const j = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"]
      .find(x => s.includes(x));
    if (/ajout|cr[ée]|programme un|nouveau cours/.test(s)) {
      const jour = j ? j.charAt(0).toUpperCase()+j.slice(1) : null;
      const h = q.match(/(\d{1,2})\s*h\s*(\d{0,2})/);
      const nomC = q.match(/(cardio|musculation|cross[\s-]?training|fitness|yoga|boxe|zumba|abdo|mobilit[ée])/i);
      if (!jour) return { ok:false, msg:"Quel jour ? (Lundi, Mardi, Mercredi…)" };
      const txt = (h ? h[1]+"h"+(h[2]||"")+" — " : "") +
        (nomC ? nomC[1].charAt(0).toUpperCase()+nomC[1].slice(1).toLowerCase() : "Cours");
      return tool.ajouterCours({ jour, txt });
    }
    return tool.planning({ jour: j ? j.charAt(0).toUpperCase()+j.slice(1) : null });
  }

  if (/avis|note|satisfaction|[ée]valuation|commentaire|retour/.test(s)) {
    if (/ajout|cr[ée]|donne|met|mets|nouvel avis/.test(s)) {
      const nom = extraireNom(q);
      if (!nom) return { ok:false, msg:"Qui a laissé l'avis ?" };
      const n = q.match(/([1-5])\s*\/\s*5/) || q.match(/note\s*:?\s*([1-5])/);
      return tool.ajouterAvis({ nom, note: n ? n[1] : 5, txt: null });
    }
    return tool.avis();
  }

  if (/personnel|\b[ée]quipe\b|staff|coach|employ|salari|qui travaille/.test(s)) return tool.personnel();

  if (/annonce|pr[ée]venir|informer|communiqu|message aux|publi(er|e)/.test(s)) {
    if (/ajout|cr[ée]|publie|nouvelle annonce|annonce que/.test(s)) {
      /* on privilégie le mot « annonce », puis on nettoie les articles de tête */
      let t = q;
      const mAnn = q.match(/annonce[rz]?\s*(?:que\s*)?[:\s]\s*(.+)$/i);
      const mPub = q.match(/(?:publie[rz]?|communique[rz]?)\s*(?:que\s*)?[:\s]\s*(.+)$/i);
      if (mAnn) t = mAnn[1];
      else if (mPub) t = mPub[1];
      t = t.replace(/^(?:une?|la|les|des|le)\s+(?:nouvelle\s+)?annonce\s*/i, "")
           .replace(/^(?:une?|la|les|des|le)\s+/i, "")
           .replace(/^["«\s]+|[»"\s]+$/g, "")
           .trim();
      if (t.length < 4) return { ok:false, msg:"Que faut-il annoncer ?" };
      return tool.ajouterAnnonce({ texte: t });
    }
    return tool.annonces();
  }

  if (/\bbon\b|bons|offert|gratuit|r[ée]duction|avantage|fid[ée]lit/.test(s)) {
    if (/ajout|cr[ée]|donne|offre|nouveau bon/.test(s)) {
      const nom = extraireNom(q);
      if (!nom) return { ok:false, msg:"À qui offrir ce bon ?" };
      const type = /r[ée]duction/.test(s) ? "Réduction" : "Séance offerte";
      return tool.ajouterBon({ nom, type });
    }
    return tool.bons();
  }

  if (/texte|mod[èe]le|template|message type|relance type|r[ée]dige/.test(s)) return tool.textes();

  if (/[ée]quipement|mat[ée]riel|machine|tapis|rameur|halt[èe]re|maintenance|panne/.test(s)) return tool.equipements();

  if (/administratif|infos? du club|fiche du club|fiche club|param[èe]tre|configuration|cloisonn/.test(s)) return tool.administratif();

  if (/rapport|bilan|synth[èe]se|r[ée]sum[ée]|[ée]tat des lieux|tableau de bord/.test(s)) return tool.rapports();

  if (/exercice|[ée]xercices|programme perso|entra[îi]nement perso|mes s[ée]ances|ce que je dois faire/.test(s)) {
    if (/ajout|assign|donne|prescri|nouvel exercice/.test(s)) {
      const nom = extraireNom(q);
      const exo = q.match(/(squat|d[ée]velopp[ée]|soulev[ée]|traction|pompe|gainage|rameur|course|v[ée]lo|bench|curl|presse|abdo)/i);
      if (!nom) return { ok:false, msg:"À quel adhérent assigner cet exercice ?" };
      return tool.ajouterExercice({
        nom: exo ? exo[1].charAt(0).toUpperCase()+exo[1].slice(1).toLowerCase() : "Exercice",
        membre: nom,
        series: (q.match(/(\d+\s*[×x]\s*\d+)/) || [])[1] || "3×10"
      });
    }
    if (role() === "adherent") return tool.mesExercices();
    return tool.exercices();
  }

  /* aide */
  if (/(aide|comment|que peux|que sais|bonjour|salut|hello)/.test(s)) {
    return { ok:true, msg:`Je gère **${clubOf(DB.club).nom}** — les 15 modules sont branchés. Dites-moi simplement :
      <ul><li>« Marie Dossou a payé son mois »</li>
      <li>« Qui expire cette semaine ? »</li>
      <li>« Combien j'ai encaissé ? »</li>
      <li>« Ajoute Jean Dupont au 97 12 34 56 »</li>
      <li>« Marie est arrivée »</li>
      <li>« Le planning du mardi »</li>
      <li>« Ajoute un cours de cardio mercredi 18h »</li>
      <li>« Montre les avis » · « les équipements » · « le personnel »</li>
      <li>« Publie une annonce : fermeture le 15 »</li>
      <li>« Donne un bon à Marie Dossou »</li>
      <li>« Le rapport du mois »</li></ul>` };
  }

  return {
    ok:false,
    msg:`Je n'ai pas compris. Essayez : « Marie Dossou a payé son mois », « qui expire cette semaine », « le planning du mardi », ou « montre les avis ».`
  };
}

/* ═══ RENDU ═══ */
const chat = document.getElementById("chat");

/* convertit **gras** en <b> et garde le reste du HTML */
function md(s) {
  return String(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}

function bulle(qui, html) {
  const d = document.createElement("div");
  d.className = "msg " + (qui === "me" ? "me" : "ag");
  d.innerHTML = md(html);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function rendreReponse(r) {
  let h = md(r.msg);
  if (r.list && r.list.length) {
    h += `<div class="data">` + r.list.map(x =>
      `<div class="drow"><div><div class="n">${x.n}</div><div class="s">${x.s}</div></div>
       <span class="tg ${x.cls}">${x.tag}</span></div>`).join("") + `</div>`;
  }
  if (r.ok) h += `<span class="act">✓ action effectuée</span>`;
  return h;
}

function send(txt) {
  const inp = document.getElementById("inp");
  const v = (txt !== undefined ? txt : inp.value).trim();
  if (!v) return;
  bulle("me", v);
  inp.value = "";
  inp.style.height = "auto";
  const r = penser(v);
  setTimeout(() => bulle("ag", rendreReponse(r)), 240);
  if (r.ok && !/stats|lister|echeances|presences/.test(v)) refreshHeader();
}

/* ═══ UTILISATEURS / RÔLES ═══ */
function switchUser(id) {
  DB.user = id; save();
  const u = me();
  if (u.club_id !== DB.club) { DB.club = u.club_id; save(); document.getElementById("clubsw").value = DB.club; }
  const c = clubOf(DB.club);
  document.getElementById("clubName").textContent = c.nom;
  refreshHeader();
  renderGrid();
  chat.innerHTML = "";
  const acces = MODS.filter(m => peut(m[0])).map(m => m[2]);
  bulle("ag", `Vous êtes connecté en **${u.nom}** — rôle **${ROLES[u.role].libelle}**.
    ${ROLES[u.role].desc}.
    <ul>${acces.map(a => `<li>${a}</li>`).join("")}</ul>`);
}

/* ═══ CLUBS ═══ */
function switchClub(id) {
  DB.club = id; save();
  const c = clubOf(id);
  document.getElementById("clubName").textContent = c.nom;
  const s = scope();
  document.getElementById("clubSub").textContent =
    `${c.ville} · ${s.membres.length} adhérent(s)`;
  chat.innerHTML = "";
  bulle("ag", `Vous êtes maintenant sur **${c.nom}** — ${c.ville}.
    Je ne vois que les données de ce club.`);
}

function refreshHeader() {
  const c = clubOf(DB.club), s = scope(), u = me();
  document.getElementById("clubSub").textContent =
    `${u.nom} · ${ROLES[u.role].libelle} · ${s.membres.filter(m=>jours(m.fin)>=0).length} actif(s)`;
}

/* ═══ MODULES — chaque entrée porte sa clé d'accès ═══ */
const MODS = [
  ["tdb",           "📊","Tableau de bord","combien j'ai d'adhérents"],
  ["adherents",     "👥","Adhérents","liste tous les adhérents"],
  ["finances",      "💰","Finances","combien j'ai encaissé"],
  ["presences",     "✅","Présences","qui est présent aujourd'hui"],
  ["echeances",     "⏰","Échéances","qui expire cette semaine"],
  ["planning",      "📅","Planning","le planning de la semaine"],
  ["exercices",     "📋","Exercices","mes exercices"],
  ["avis",          "⭐","Avis","montre les avis"],
  ["personnel",     "👤","Personnel","le personnel"],
  ["rapports",      "📈","Rapports","le rapport du mois"],
  ["annonces",      "📢","Annonces","les annonces"],
  ["bons",          "🎫","Bons","les bons"],
  ["textes",        "📝","Textes","les modèles de messages"],
  ["equipements",   "🛒","Équipements","les équipements"],
  ["administratif", "⚙️","Administratif","la fiche du club"]
];

const grid = document.getElementById("grid");

function renderGrid() {
  grid.innerHTML = "";
  let n = 0;
  MODS.forEach(([cle, e, nom, q]) => {
    if (!peut(cle)) return;              /* rôle non autorisé → le module n'existe pas */
    n++;
    const b = document.createElement("button");
    b.innerHTML = `<span class="e">${e}</span>${nom}`;
    b.onclick = () => {
      closeTools();
      if (q) send(q);
      else bulle("ag", `Le module **${nom}** n'est pas encore branché à l'assistant.`);
    };
    grid.appendChild(b);
  });
  if (!n) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#8a93a6;font-size:13px;padding:30px 0">
      Aucun module accessible avec le rôle ${ROLES[role()].libelle}.</div>`;
  }
}

function openTools(){ renderGrid(); document.getElementById("tools").classList.add("on"); }
function closeTools(){ document.getElementById("tools").classList.remove("on"); }
