<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<title>Samari Club — Agent</title>
<style>
:root{
  --bg:#0a0b0e; --card:#15171c; --card2:#1b1e25; --line:#252932;
  --gold:#e8b93f; --txt:#f2f4f8; --mut:#868e9e;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}

/* BARRE HAUTE */
.hdr{padding:12px 16px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);background:rgba(10,11,14,.92);
  backdrop-filter:blur(12px);position:sticky;top:0;z-index:20}
.logo{width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(145deg,#1d2028,#0d0e11);border:1px solid #2d323d;
  display:flex;align-items:center;justify-content:center;font-size:16px}
.hdr .t{flex:1;min-width:0}
.hdr .t b{display:block;font-size:14px;font-weight:800;letter-spacing:.02em}
.hdr .t span{font-size:10.5px;color:var(--mut)}
.clubsw{background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:700;
  font-family:inherit;outline:none;max-width:120px}

/* ZONE CHAT */
.chat{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:15px;font-size:14px;line-height:1.5;
  animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:var(--gold);color:#0a0b0e;font-weight:600;
  border-bottom-right-radius:5px}
.msg.ag{align-self:flex-start;background:var(--card);border:1px solid var(--line);
  border-bottom-left-radius:5px}
.msg.ag .act{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ok);font-weight:700}
.msg.ag ul{margin:7px 0 0;padding-left:17px}
.msg.ag li{margin:3px 0;font-size:13px}
.msg.ag b{color:var(--gold)}

/* CARTES DONNÉES */
.data{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.drow{background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.drow .n{font-size:13px;font-weight:700}
.drow .s{font-size:10.5px;color:var(--mut);margin-top:2px}
.tg{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 8px;border-radius:999px;white-space:nowrap}
.tg.ok{background:rgba(52,211,153,.14);color:var(--ok)}
.tg.warn{background:rgba(251,191,36,.14);color:var(--warn)}
.tg.bad{background:rgba(248,113,113,.14);color:var(--bad)}

/* SUGGESTIONS */
.sugg{display:flex;gap:7px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);
  color:var(--mut);border-radius:999px;padding:8px 14px;font-size:12px;
  font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s}
.sugg button:active{background:var(--card2);color:var(--txt)}

/* SAISIE */
.inputbar{padding:10px 16px 16px;background:rgba(10,11,14,.96);
  border-top:1px solid var(--line);position:sticky;bottom:0}
.ibox{display:flex;gap:9px;align-items:flex-end}
.ibox textarea{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:16px;padding:12px 15px;font-size:14.5px;font-family:inherit;
  resize:none;outline:none;max-height:110px;line-height:1.4}
.ibox textarea::placeholder{color:#5a6272}
.ibox textarea:focus{border-color:#3a4150}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);
  color:#0a0b0e;font-size:19px;font-weight:800;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center}
.send:active{transform:scale(.94)}

/* MODULES (raccourcis) */
.tools{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;
  flex-direction:column;overflow-y:auto;padding:16px}
.tools.on{display:flex}
.tools .th{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.tools h3{margin:0;font-size:17px;font-weight:900}
.tools .cl{border:1px solid var(--line);background:var(--card);color:var(--txt);
  border-radius:9px;padding:7px 12px;font-size:12px;font-family:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:var(--txt);padding:15px 10px;font-size:12.5px;font-weight:600;
  font-family:inherit;cursor:pointer;text-align:left}
.grid button:active{background:var(--card2)}
.grid button .e{display:block;font-size:17px;margin-bottom:5px}

.fab{position:fixed;right:16px;bottom:96px;width:44px;height:44px;border-radius:50%;
  background:var(--card2);border:1px solid var(--line);color:var(--txt);
  font-size:18px;cursor:pointer;z-index:30;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">🏍️</div>
  <div class="t">
    <b id="clubName">Samari Club</b>
    <span id="clubSub">Porto-Novo · 1 salle</span>
  </div>
  <select class="clubsw" id="clubsw" onchange="switchClub(this.value)"></select>
</div>

<div class="chat" id="chat"></div>

<div class="sugg" id="sugg"></div>

<div class="inputbar">
  <div class="ibox">
    <textarea id="inp" rows="1"
      placeholder="Dites-moi ce qu'il faut faire…"></textarea>
    <button class="send" onclick="send()">↑</button>
  </div>
</div>

<button class="fab" onclick="openTools()">☰</button>

<div class="tools" id="tools">
  <div class="th"><h3>Modules</h3><button class="cl" onclick="closeTools()">Fermer</button></div>
  <div class="grid" id="grid"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   MODÈLE CLOISONNÉ
   Chaque enregistrement porte club_id. Aucun accès sans ce champ.
   C'est la règle posée dès le premier jour — pas ajoutée après.
   ═══════════════════════════════════════════════════════════════ */

const KEY = "samari_agent_v1";
const CLUBS = [
  { id: "samari-porto", nom: "Samari Club", ville: "Porto-Novo" },
  { id: "samari-cotonou", nom: "Samari Cotonou", ville: "Cotonou" }
];

function seed() {
  const now = Date.now(), d = n => now + n * 86400000;
  return {
    club: "samari-porto",
    membres: [
      { id:1, club_id:"samari-porto", nom:"Ayaba Christelle", tel:"+229 97 12 34 56", form:"Mensuel", fin:d(18) },
      { id:2, club_id:"samari-porto", nom:"Dossou Marie", tel:"+229 96 45 78 12", form:"Mensuel", fin:d(4) },
      { id:3, club_id:"samari-porto", nom:"Kpadonou Serge", tel:"+229 95 33 21 90", form:"Trimestriel", fin:d(62) },
      { id:4, club_id:"samari-porto", nom:"Houngbédji Ange", tel:"+229 97 88 44 20", form:"Annuel", fin:d(210) },
      { id:5, club_id:"samari-porto", nom:"Bocco Rachidatou", tel:"+229 96 21 55 33", form:"Mensuel", fin:d(2) },
      { id:6, club_id:"samari-porto", nom:"Agossou Bienvenu", tel:"+229 94 77 11 02", form:"Mensuel", fin:d(11) },
      { id:7, club_id:"samari-porto", nom:"Tossou Léonie", tel:"+229 97 60 40 08", form:"Trimestriel", fin:d(48) },
      { id:8, club_id:"samari-porto", nom:"Zinsou Modeste", tel:"+229 95 12 88 76", form:"Mensuel", fin:d(23) },
      { id:9, club_id:"samari-porto", nom:"Ahouandjinou Rose", tel:"+229 96 99 30 45", form:"Mensuel", fin:d(6) },
      /* club 2 — pour prouver le cloisonnement */
      { id:20, club_id:"samari-cotonou", nom:"Adjovi Paul", tel:"+229 97 00 11 22", form:"Mensuel", fin:d(12) },
      { id:21, club_id:"samari-cotonou", nom:"Sossou Gisèle", tel:"+229 96 33 44 55", form:"Trimestriel", fin:d(75) }
    ],
    ops: [
      { id:1, club_id:"samari-porto", type:"recette", lib:"Abonnement Dossou Marie", montant:5000, jour:0 },
      { id:2, club_id:"samari-porto", type:"recette", lib:"Abonnement Ayaba Christelle", montant:5000, jour:1 },
      { id:3, club_id:"samari-porto", type:"depense", lib:"Électricité", montant:18000, jour:2 },
      { id:4, club_id:"samari-porto", type:"recette", lib:"Abonnement Kpadonou Serge", montant:13500, jour:3 },
      { id:5, club_id:"samari-porto", type:"depense", lib:"Entretien matériel", montant:9000, jour:4 },
      { id:20, club_id:"samari-cotonou", type:"recette", lib:"Abonnement Adjovi Paul", montant:5000, jour:1 }
    ],
    pres: [
      { id:1, club_id:"samari-porto", membre:"Ayaba Christelle", jour:0 },
      { id:2, club_id:"samari-porto", membre:"Zinsou Modeste", jour:0 },
      { id:3, club_id:"samari-porto", membre:"Tossou Léonie", jour:1 },
      { id:20, club_id:"samari-cotonou", membre:"Adjovi Paul", jour:0 }
    ]
  };
}

let DB = JSON.parse(localStorage.getItem(KEY) || "null") || seed();
const save = () => localStorage.setItem(KEY, JSON.stringify(DB));

/* ═══ CLOISONNEMENT — point d'entrée unique ═══ */
function scope() {
  const c = DB.club;
  return {
    club: c,
    membres: DB.membres.filter(m => m.club_id === c),
    ops:     DB.ops.filter(o => o.club_id === c),
    pres:    DB.pres.filter(p => p.club_id === c)
  };
}

/* ═══ OUTILS DE L'AGENT — il AGIT, il ne répond pas seulement ═══ */
const tool = {
  ajouterMembre({ nom, tel, formule }) {
    const s = scope();
    if (s.membres.some(m => norm(m.nom) === norm(nom)))
      return { ok:false, msg:`${nom} existe déjà dans ce club.` };
    DB.membres.push({
      id: Date.now(), club_id: DB.club, nom,
      tel: tel || "—", form: formule || "Mensuel",
      fin: Date.now() + 30 * 86400000
    });
    save();
    return { ok:true, msg:`**${nom}** ajouté à ${clubOf(DB.club).nom}. Abonnement mensuel jusqu'au ${fmtDate(Date.now()+30*86400000)}.` };
  },

  payer({ nom, montant }) {
    const s = scope();
    const m = find(s.membres, nom);
    if (!m) return { ok:false, msg:`Je ne trouve pas **${nom}** dans ${clubOf(DB.club).nom}.` };
    const duree = m.form === "Annuel" ? 365 : m.form === "Trimestriel" ? 90 : 30;
    const base = Math.max(m.fin, Date.now());
    m.fin = base + duree * 86400000;
    DB.ops.push({ id:Date.now(), club_id:DB.club, type:"recette",
      lib:`Abonnement ${m.nom}`, montant: montant || 5000, jour:0 });
    DB.pres.push({ id:Date.now()+1, club_id:DB.club, membre:m.nom, jour:0 });
    save();
    return { ok:true, msg:`Paiement enregistré pour **${m.nom}** : ${(montant||5000).toLocaleString("fr-FR")} FCFA.
      Abonnement prolongé de ${duree} jours → **${fmtDate(m.fin)}**. Présence notée aujourd'hui.` };
  },

  pointer({ nom }) {
    const s = scope();
    const m = find(s.membres, nom);
    if (!m) return { ok:false, msg:`Je ne trouve pas **${nom}** dans ce club.` };
    if (jours(m.fin) < 0) return { ok:false, msg:`**${m.nom}** a un abonnement expiré depuis ${Math.abs(jours(m.fin))} jours. Faut-il encaisser avant de pointer ?` };
    DB.pres.push({ id:Date.now(), club_id:DB.club, membre:m.nom, jour:0 });
    save();
    return { ok:true, msg:`Présence notée pour **${m.nom}**.` };
  },

  echeances({ joursMax }) {
    const s = scope();
    const j = joursMax || 7;
    const l = s.membres.filter(m => jours(m.fin) <= j).sort((a,b) => a.fin - b.fin);
    if (!l.length) return { ok:true, msg:`Aucun adhérent n'expire dans les ${j} jours.`, list:[] };
    return {
      ok:true,
      msg:`**${l.length} adhérent(s)** expirent dans les ${j} jours :`,
      list: l.map(m => ({
        n: m.nom,
        s: `${m.form} · ${m.tel}`,
        tag: jours(m.fin) < 0 ? "Expiré" : jours(m.fin) + " j",
        cls: jours(m.fin) < 0 ? "bad" : jours(m.fin) <= 3 ? "bad" : "warn"
      }))
    };
  },

  stats() {
    const s = scope();
    const actifs = s.membres.filter(m => jours(m.fin) >= 0);
    const R = s.ops.filter(o => o.type === "recette").reduce((a,o) => a+o.montant, 0);
    const D = s.ops.filter(o => o.type === "depense").reduce((a,o) => a+o.montant, 0);
    return {
      ok:true,
      msg:`**${clubOf(DB.club).nom}** — ${actifs.length} adhérents actifs sur ${s.membres.length}.`,
      list: [
        { n:"Adhérents actifs", s:`sur ${s.membres.length} inscrits`, tag:String(actifs.length), cls:"ok" },
        { n:"Expirent sous 7 jours", s:"à relancer", tag:String(actifs.filter(m=>jours(m.fin)<=7).length), cls:"warn" },
        { n:"Recettes cumulées", s:"depuis le début", tag:R.toLocaleString("fr-FR")+" F", cls:"ok" },
        { n:"Dépenses cumulées", s:"depuis le début", tag:D.toLocaleString("fr-FR")+" F", cls:"bad" },
        { n:"Solde", s:"recettes − dépenses", tag:(R-D).toLocaleString("fr-FR")+" F", cls:"ok" }
      ]
    };
  },

  presences() {
    const s = scope();
    const t = s.pres.filter(p => p.jour === 0);
    return {
      ok:true,
      msg:`**${t.length} présence(s)** aujourd'hui à ${clubOf(DB.club).nom}.`,
      list: t.map(p => ({ n:p.membre, s:"pointé aujourd'hui", tag:"Présent", cls:"ok" }))
    };
  },

  lister() {
    const s = scope();
    return {
      ok:true,
      msg:`**${s.membres.length} adhérent(s)** à ${clubOf(DB.club).nom} :`,
      list: s.membres.map(m => ({
        n:m.nom, s:`${m.form} · ${m.tel}`,
        tag: jours(m.fin) < 0 ? "Expiré" : jours(m.fin)+" j",
        cls: jours(m.fin) < 0 ? "bad" : jours(m.fin) <= 7 ? "warn" : "ok"
      }))
    };
  }
};

/* ═══ COMPRÉHENSION ═══ */
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const jours = f => Math.ceil((f - Date.now()) / 86400000);
const clubOf = id => CLUBS.find(c => c.id === id) || CLUBS[0];
const fmtDate = ts => new Date(ts).toLocaleDateString("fr-FR",{day:"2-digit",month:"long"});

function find(liste, nom) {
  const n = norm(nom);
  let m = liste.find(x => norm(x.nom) === n);
  if (m) return m;
  m = liste.find(x => norm(x.nom).includes(n));
  if (m) return m;
  const parts = n.split(/\s+/).filter(p => p.length > 2);
  return liste.find(x => parts.length && parts.every(p => norm(x.nom).includes(p)));
}

/* extrait un nom propre d'une phrase */
function extraireNom(q) {
  const s = scope();
  const nq = norm(q);
  /* 1. correspondance exacte avec un adhérent connu */
  for (const m of s.membres) {
    if (nq.includes(norm(m.nom))) return m.nom;
    const prenom = norm(m.nom).split(/\s+/)[0];
    if (prenom.length > 3 && nq.includes(prenom)) return m.nom;
  }
  /* 2. après "ajoute/ajouter/crée" — on prend les mots capitalisés */
  const m2 = q.match(/(?:ajoute[rz]?|cr[ée]e[rz]?|inscri[re]+|nouvel? adh[ée]rent)\s+(?:un\s+|une\s+|le\s+|la\s+)?([A-ZÀ-Ý][\wÀ-ÿ'’-]+(?:\s+[A-ZÀ-Ý][\wÀ-ÿ'’-]+){0,2})/);
  if (m2) return m2[1].trim();
  return null;
}

/* ═══ LE CERVEAU ═══ */
function penser(q) {
  const s = norm(q);

  /* --- ACTIONS PRIORITAIRES --- */

  /* paiement */
  if (/(pay|paye|payé|régl|regl|encaiss|versé|verse|cotisation).*(mois|an|trim|abonnement)|^(pay|paye)/.test(s)
      || /(a|à) pay/.test(s)) {
    const nom = extraireNom(q);
    if (!nom) return { ok:false, msg:"Qui a payé ? Donnez-moi le nom." };
    const mnt = q.match(/(\d[\d\s]{2,})/);
    return tool.payer({ nom, montant: mnt ? parseInt(mnt[1].replace(/\s/g,""),10) : null });
  }

  /* ajout d'adhérent */
  if (/(ajout|cr[ée]|inscri|nouvel? adh|enregistr).*(adh|membre|client)|^(ajoute|ajouter|cree|créer)/.test(s)) {
    const nom = extraireNom(q);
    if (!nom || nom.split(/\s+/).length < 1) return { ok:false, msg:"Quel nom dois-je enregistrer ?" };
    const tel = q.match(/(\+?\d[\d\s]{7,})/);
    const formule = /annuel/.test(s) ? "Annuel" : /trimestr/.test(s) ? "Trimestriel" : "Mensuel";
    return tool.ajouterMembre({ nom, tel: tel ? tel[1].trim() : null, formule });
  }

  /* présence */
  if (/(est l[àa]|pr[ée]sent|pointer|pointage|arriv|vient d'arriver|scann)/.test(s)) {
    const nom = extraireNom(q);
    if (!nom) return tool.presences();
    return tool.pointer({ nom });
  }

  /* échéances */
  if (/(expire|expir|échéance|echeance|renouvel|relanc|fin d'abonnement|qui doit payer)/.test(s)) {
    const j = /mois/.test(s) ? 31 : /3 jour|trois jour/.test(s) ? 3 : /aujourd/.test(s) ? 0 : 7;
    return tool.echeances({ joursMax: j });
  }

  /* chiffres */
  if (/(combien|total|chiffre|recette|d[ée]pense|solde|b[ée]n[ée]fice|gagn|encaiss)/.test(s)) {
    if (/adh[ée]rent|membre/.test(s) && !/recette|d[ée]pense/.test(s)) return tool.lister();
    if (/pr[ée]sent/.test(s)) return tool.presences();
    return tool.stats();
  }

  /* liste */
  if (/(liste|qui est|montre|affiche|tous les|adh[ée]rents)/.test(s)) return tool.lister();

  /* aide */
  if (/(aide|comment|que peux|que sais|bonjour|salut|hello)/.test(s)) {
    return { ok:true, msg:`Je gère **${clubOf(DB.club).nom}**. Dites-moi simplement :
      <ul><li>« Marie Dossou a payé son mois »</li>
      <li>« Qui expire cette semaine ? »</li>
      <li>« Combien j'ai encaissé ? »</li>
      <li>« Ajoute Jean Dupont au 97 12 34 56 »</li>
      <li>« Marie est arrivée »</li></ul>` };
  }

  return {
    ok:false,
    msg:`Je n'ai pas compris. Essayez : « Marie Dossou a payé son mois », « qui expire cette semaine », ou « combien j'ai encaissé ».`
  };
}

/* ═══ RENDU ═══ */
const chat = document.getElementById("chat");

function bulle(qui, html) {
  const d = document.createElement("div");
  d.className = "msg " + (qui === "me" ? "me" : "ag");
  d.innerHTML = html;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function rendreReponse(r) {
  let h = r.msg;
  if (r.list && r.list.length) {
    h += `<div class="data">` + r.list.map(x =>
      `<div class="drow"><div><div class="n">${x.n}</div><div class="s">${x.s}</div></div>
       <span class="tg ${x.cls}">${x.tag}</span></div>`).join("") + `</div>`;
  }
  if (r.ok) h += `<span class="act">✓ action effectuée</span>`;
  return h;
}

function send(txt) {
  const inp = document.getElementById("inp");
  const v = (txt !== undefined ? txt : inp.value).trim();
  if (!v) return;
  bulle("me", v);
  inp.value = "";
  inp.style.height = "auto";
  const r = penser(v);
  setTimeout(() => bulle("ag", rendreReponse(r)), 240);
  if (r.ok && !/stats|lister|echeances|presences/.test(v)) refreshHeader();
}

/* ═══ CLUBS ═══ */
function switchClub(id) {
  DB.club = id; save();
  const c = clubOf(id);
  document.getElementById("clubName").textContent = c.nom;
  const s = scope();
  document.getElementById("clubSub").textContent =
    `${c.ville} · ${s.membres.length} adhérent(s)`;
  chat.innerHTML = "";
  bulle("ag", `Vous êtes maintenant sur **${c.nom}** — ${c.ville}.
    Je ne vois que les données de ce club.`);
}

function refreshHeader() {
  const c = clubOf(DB.club), s = scope();
  document.getElementById("clubSub").textContent =
    `${c.ville} · ${s.membres.filter(m=>jours(m.fin)>=0).length} actif(s)`;
}

/* ═══ MODULES ═══ */
const MODS = [
  ["📊","Tableau de bord","combien j'ai d'adhérents"],
